<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous AI Agency</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for a sleek look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 flex flex-col items-center py-10 px-4 font-sans">

    <div class="w-full max-w-4xl bg-gray-900 rounded-xl shadow-2xl overflow-hidden border border-gray-800 flex flex-col h-[85vh]">
        
        <!-- Header -->
        <div class="flex justify-between items-center p-4 border-b border-gray-800 bg-gray-900">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="file-code" class="text-blue-500"></i> Autonomous Agency
            </h1>
            <div class="flex gap-2">
                <button onclick="resetSession()" class="p-2 hover:bg-gray-800 rounded flex items-center gap-2 text-sm text-gray-400 transition">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> New Session
                </button>
                <button onclick="toggleSettings()" class="p-2 hover:bg-gray-800 rounded text-gray-400 transition">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Settings Dropdown -->
        <div id="settingsPanel" class="hidden p-4 bg-gray-800 border-b border-gray-700 space-y-4">
            <div>
                <label class="text-xs text-gray-400">Cloudflared Backend URL</label>
                <input type="text" id="backendUrl" class="w-full p-2 mt-1 bg-gray-900 rounded border border-gray-700 text-sm outline-none focus:border-blue-500" value="https://your-tunnel.trycloudflare.com">
            </div>
            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="text-xs text-gray-400">GitHub PAT (Optional)</label>
                    <input type="password" id="githubToken" placeholder="ghp_..." class="w-full p-2 mt-1 bg-gray-900 rounded border border-gray-700 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="flex-1">
                    <label class="text-xs text-gray-400">Target Repository</label>
                    <input type="text" id="githubRepo" placeholder="e.g., ai-generated-app" class="w-full p-2 mt-1 bg-gray-900 rounded border border-gray-700 text-sm outline-none focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Output / Chat Area -->
        <div id="outputArea" class="flex-1 p-6 overflow-y-auto bg-gray-950/50 relative">
            <div id="emptyState" class="flex items-center justify-center h-full text-gray-500 text-sm">
                Provide instructions and attach files to begin.
            </div>
            
            <div id="loadingState" class="hidden flex-col items-center justify-center h-full text-gray-400 space-y-4">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-500"></i>
                <p id="loadingText">Agency Swarm is working...</p>
            </div>

            <div id="resultsContent" class="space-y-6 hidden">
                <!-- Plan and Code will be injected here via JS -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-900 border-t border-gray-800">
            
            <!-- HITL Approval State -->
            <div id="approvalBanner" class="hidden mb-4 p-3 bg-blue-900/30 border border-blue-800 rounded-lg flex items-center justify-between">
                <span class="text-sm text-blue-200">The Project Manager is waiting for your approval.</span>
                <button onclick="callBackend('approve')" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm transition text-white">
                    <i data-lucide="check" class="w-4 h-4"></i> Approve & Build
                </button>
            </div>

            <!-- File Previews -->
            <div id="fileList" class="flex gap-2 mb-3 overflow-x-auto empty:hidden"></div>
            
            <div class="flex gap-2 items-end">
                <label class="p-3 bg-gray-800 hover:bg-gray-700 rounded-lg cursor-pointer transition border border-gray-700 flex items-center justify-center h-[46px] w-[46px]">
                    <i data-lucide="paperclip" class="w-5 h-5 text-gray-400"></i>
                    <input type="file" id="fileInput" multiple class="hidden" onchange="handleFiles()">
                </label>
                
                <textarea id="promptInput" placeholder="Describe the feature or project to build..." 
                          class="flex-1 bg-gray-950 p-3 rounded-lg border border-gray-700 resize-none outline-none focus:border-blue-500 text-sm" 
                          rows="1" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                
                <button id="sendBtn" onclick="handleSend()" class="p-3 bg-white text-gray-900 hover:bg-gray-200 rounded-lg transition flex items-center justify-center h-[46px] w-[46px]">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // State Variables
        let threadId = Math.random().toString(36).substring(7);
        let selectedFiles = [];
        let isPaused = false;

        // UI Elements
        const settingsPanel = document.getElementById('settingsPanel');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const promptInput = document.getElementById('promptInput');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const resultsContent = document.getElementById('resultsContent');
        const approvalBanner = document.getElementById('approvalBanner');
        const sendBtn = document.getElementById('sendBtn');

        function toggleSettings() {
            settingsPanel.classList.toggle('hidden');
        }

        function resetSession() {
            threadId = Math.random().toString(36).substring(7);
            selectedFiles = [];
            isPaused = false;
            promptInput.value = '';
            promptInput.placeholder = "Describe the feature or project to build...";
            fileList.innerHTML = '';
            resultsContent.innerHTML = '';
            emptyState.classList.remove('hidden');
            resultsContent.classList.add('hidden');
            approvalBanner.classList.add('hidden');
        }

        function handleFiles() {
            Array.from(fileInput.files).forEach(file => {
                selectedFiles.push(file);
                const span = document.createElement('span');
                span.className = "text-xs bg-gray-800 px-3 py-1 rounded-full border border-gray-700 text-gray-300 whitespace-nowrap";
                span.innerText = file.name;
                fileList.appendChild(span);
            });
            // Reset input so same file can be selected again if needed
            fileInput.value = ""; 
        }

        function handleSend() {
            if (!promptInput.value.trim() && selectedFiles.length === 0 && !isPaused) return;
            const action = isPaused ? "feedback" : "start";
            callBackend(action);
        }

        async function callBackend(action) {
            const backendUrl = document.getElementById('backendUrl').value.replace(/\/$/, "");
            const githubToken = document.getElementById('githubToken').value;
            const githubRepo = document.getElementById('githubRepo').value;
            const prompt = promptInput.value.trim();

            if (!backendUrl) {
                alert("Please provide your Cloudflared Backend URL in settings.");
                return;
            }

            // UI Loading State
            emptyState.classList.add('hidden');
            resultsContent.classList.add('hidden');
            approvalBanner.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            promptInput.value = '';
            promptInput.style.height = '';
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');

            const formData = new FormData();
            formData.append("thread_id", threadId);
            formData.append("action", action);
            if (prompt) formData.append("prompt", prompt);
            if (githubToken) formData.append("github_token", githubToken);
            if (githubRepo) formData.append("github_repo", githubRepo);
            selectedFiles.forEach(f => formData.append("files", f));

            try {
                const response = await fetch(`${backendUrl}/api/chat`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Backend connection failed.");
                
                const data = await response.json();
                renderResults(data);
                
                // Clear files after successful send
                selectedFiles = [];
                fileList.innerHTML = '';
                
            } catch (error) {
                alert("Error connecting to backend: Ensure FastAPI is running and your Cloudflared URL is correct.");
            } finally {
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50');
            }
        }

        function renderResults(data) {
            isPaused = data.is_paused;
            resultsContent.innerHTML = '';
            
            if (data.plan) {
                resultsContent.innerHTML += `
                    <div class="p-4 bg-gray-800 rounded border border-gray-700 shadow-sm">
                        <h3 class="text-blue-400 font-semibold mb-2">Project Manager's Blueprint</h3>
                        <pre class="text-sm text-gray-300 font-sans leading-relaxed">${escapeHtml(data.plan)}</pre>
                    </div>
                `;
            }

            if (data.code_files && Object.keys(data.code_files).length > 0) {
                let codeHtml = `
                    <div class="p-4 bg-green-900/20 border border-green-800/50 rounded mt-6">
                        <h3 class="text-green-400 font-semibold mb-4">Final Optimized Code</h3>
                `;
                
                if (data.github_url) {
                    codeHtml += `
                        <a href="${data.github_url}" target="_blank" class="inline-flex items-center gap-2 text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mb-4 transition">
                            <i data-lucide="github" class="w-4 h-4"></i> View Pull Request on GitHub
                        </a>
                    `;
                }

                for (const [filename, code] of Object.entries(data.code_files)) {
                    codeHtml += `
                        <div class="mb-4">
                            <p class="text-xs text-gray-400 bg-gray-900 p-2 rounded-t font-mono border border-gray-800 border-b-0">${escapeHtml(filename)}</p>
                            <pre class="bg-gray-950 p-4 rounded-b text-xs text-gray-300 overflow-x-auto border border-gray-800">${escapeHtml(code)}</pre>
                        </div>
                    `;
                }
                codeHtml += `</div>`;
                resultsContent.innerHTML += codeHtml;
            }

            resultsContent.classList.remove('hidden');
            lucide.createIcons();

            if (isPaused) {
                approvalBanner.classList.remove('hidden');
                promptInput.placeholder = "Request changes to the plan...";
            } else {
                promptInput.placeholder = "Describe the feature or project to build...";
            }
            
            // Scroll to bottom
            const outputArea = document.getElementById('outputArea');
            outputArea.scrollTop = outputArea.scrollHeight;
        }

        // Helper to prevent XSS rendering
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
