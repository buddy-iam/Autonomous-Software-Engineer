<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous AI Agency</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        html, body { height: 100%; margin: 0; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col font-sans h-screen w-full">

    <!-- Top Navbar -->
    <header class="flex-none bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center z-20 w-full shadow-md">
        <h1 class="text-xl font-bold flex items-center gap-3">
            <i data-lucide="bot" class="text-blue-500 w-7 h-7"></i> 
            Autonomous Agency
        </h1>
        <div class="flex gap-3">
            <button onclick="resetSession()" class="px-4 py-2 hover:bg-gray-800 rounded-lg flex items-center gap-2 text-sm text-gray-300 transition border border-gray-700 hover:border-gray-600">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> New Session
            </button>
            <button onclick="toggleSettings()" class="p-2 hover:bg-gray-800 rounded-lg text-gray-400 transition border border-gray-700 hover:border-gray-600">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Settings Modal (Absolute overlay) -->
    <div id="settingsPanel" class="hidden absolute top-16 right-6 w-96 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl z-30 p-5 space-y-4">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-semibold text-gray-200 flex items-center gap-2"><i data-lucide="server" class="w-4 h-4"></i> Configuration</h3>
            <button onclick="toggleSettings()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div>
            <label class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Cloudflared Backend URL</label>
            <input type="text" id="backendUrl" class="w-full p-2.5 mt-1.5 bg-gray-900 rounded-lg border border-gray-700 text-sm outline-none focus:border-blue-500 transition" value="https://your-tunnel.trycloudflare.com">
        </div>
        <div>
            <label class="text-xs text-gray-400 uppercase tracking-wider font-semibold">GitHub PAT (Optional)</label>
            <input type="password" id="githubToken" placeholder="ghp_..." class="w-full p-2.5 mt-1.5 bg-gray-900 rounded-lg border border-gray-700 text-sm outline-none focus:border-blue-500 transition">
        </div>
        <div>
            <label class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Target Repository</label>
            <input type="text" id="githubRepo" placeholder="e.g., ai-generated-app" class="w-full p-2.5 mt-1.5 bg-gray-900 rounded-lg border border-gray-700 text-sm outline-none focus:border-blue-500 transition">
        </div>
    </div>

    <!-- Main Chat Area -->
    <main id="chatContainer" class="flex-1 overflow-y-auto bg-gray-950 p-4 md:p-8 scroll-smooth w-full">
        <!-- Chat History Wrapper -->
        <div id="chatHistory" class="max-w-5xl mx-auto flex flex-col gap-6 pb-32">
            <div id="emptyState" class="flex flex-col items-center justify-center text-gray-500 mt-20 space-y-4">
                <i data-lucide="cpu" class="w-16 h-16 text-gray-700"></i>
                <p class="text-lg">System ready. Describe your project to deploy the swarm.</p>
            </div>
        </div>
    </main>

    <!-- Bottom Input Area -->
    <footer class="flex-none bg-gray-900 border-t border-gray-800 w-full p-4 relative z-20 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="max-w-5xl mx-auto relative">
            
            <!-- HITL Approval Banner (Floats above input) -->
            <div id="approvalBanner" class="hidden absolute bottom-full left-0 w-full mb-4 p-4 bg-blue-900/40 border border-blue-700/50 rounded-xl flex items-center justify-between backdrop-blur-sm shadow-xl">
                <div class="flex items-center gap-3">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-blue-400"></i>
                    <span class="text-sm text-blue-100 font-medium">Project Manager is waiting for your approval to start building.</span>
                </div>
                <button onclick="handleApprove()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 px-5 py-2.5 rounded-lg text-sm font-semibold transition text-white shadow-lg shadow-blue-900/20">
                    <i data-lucide="check-circle" class="w-4 h-4"></i> Approve & Build
                </button>
            </div>

            <!-- Selected Files Preview -->
            <div id="fileList" class="flex gap-2 mb-3 overflow-x-auto empty:hidden pb-1"></div>
            
            <div class="flex gap-3 items-end bg-gray-950 p-2 rounded-2xl border border-gray-800 shadow-inner focus-within:border-gray-600 transition-colors">
                <label class="p-3 bg-gray-900 hover:bg-gray-800 rounded-xl cursor-pointer transition text-gray-400 hover:text-blue-400">
                    <i data-lucide="paperclip" class="w-5 h-5"></i>
                    <input type="file" id="fileInput" multiple class="hidden" onchange="handleFiles()">
                </label>
                
                <textarea id="promptInput" placeholder="Describe the feature or project..." 
                          class="flex-1 bg-transparent p-3 resize-none outline-none text-sm text-gray-100 max-h-48 overflow-y-auto" 
                          rows="1" oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 200) + 'px'"
                          onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); handleSend(); }"></textarea>
                
                <button id="sendBtn" onclick="handleSend()" class="p-3 bg-white text-gray-900 hover:bg-gray-200 rounded-xl transition flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="text-center mt-2 text-[10px] text-gray-500">
                Shift + Enter for new line. Enter to send.
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // State Variables
        let threadId = Math.random().toString(36).substring(7);
        let selectedFiles = [];
        let isPaused = false;
        let isWaitingForResponse = false;

        // UI Elements
        const settingsPanel = document.getElementById('settingsPanel');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const promptInput = document.getElementById('promptInput');
        const emptyState = document.getElementById('emptyState');
        const chatHistory = document.getElementById('chatHistory');
        const chatContainer = document.getElementById('chatContainer');
        const approvalBanner = document.getElementById('approvalBanner');
        const sendBtn = document.getElementById('sendBtn');

        function toggleSettings() {
            settingsPanel.classList.toggle('hidden');
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function resetSession() {
            if(!confirm("Start a new session? This will clear the current chat history.")) return;
            threadId = Math.random().toString(36).substring(7);
            selectedFiles = [];
            isPaused = false;
            promptInput.value = '';
            fileList.innerHTML = '';
            chatHistory.innerHTML = '';
            chatHistory.appendChild(emptyState);
            emptyState.classList.remove('hidden');
            approvalBanner.classList.add('hidden');
            promptInput.placeholder = "Describe the feature or project...";
            promptInput.style.height = 'auto';
        }

        function handleFiles() {
            Array.from(fileInput.files).forEach(file => {
                selectedFiles.push(file);
                const span = document.createElement('span');
                span.className = "flex items-center gap-1 text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 text-gray-300 whitespace-nowrap";
                span.innerHTML = `<i data-lucide="file" class="w-3 h-3 text-blue-400"></i> ${file.name}`;
                fileList.appendChild(span);
            });
            fileInput.value = ""; 
            lucide.createIcons();
        }

        function appendUserMessage(text, files) {
            emptyState.classList.add('hidden');
            
            let fileHtml = '';
            if (files && files.length > 0) {
                fileHtml = `<div class="flex flex-wrap gap-2 mb-2">`;
                files.forEach(f => {
                    fileHtml += `<span class="text-xs bg-blue-700/50 px-2 py-1 rounded-md border border-blue-600/50 flex items-center gap-1"><i data-lucide="file-text" class="w-3 h-3"></i> ${f.name}</span>`;
                });
                fileHtml += `</div>`;
            }

            const html = `
                <div class="self-end bg-blue-600 text-white rounded-2xl rounded-tr-sm px-5 py-4 max-w-[85%] md:max-w-[75%] shadow-md">
                    ${fileHtml}
                    <div class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(text)}</div>
                </div>
            `;
            chatHistory.insertAdjacentHTML('beforeend', html);
            lucide.createIcons();
            scrollToBottom();
        }

        function appendAgentLoading() {
            const id = 'loading-' + Date.now();
            const html = `
                <div id="${id}" class="self-start bg-gray-900 border border-gray-800 text-gray-100 rounded-2xl rounded-tl-sm px-6 py-5 w-full shadow-lg flex items-center gap-4">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-blue-500"></i>
                    <span class="text-sm text-gray-400 animate-pulse">Agency Swarm is processing...</span>
                </div>
            `;
            chatHistory.insertAdjacentHTML('beforeend', html);
            lucide.createIcons();
            scrollToBottom();
            return id;
        }

        function appendAgentMessage(data) {
            let contentHtml = '';
            
            // Render Plan
            if (data.plan) {
                contentHtml += `
                    <div class="mb-4">
                        <h3 class="text-blue-400 font-semibold mb-2 flex items-center gap-2"><i data-lucide="clipboard-list" class="w-4 h-4"></i> Architecture Blueprint</h3>
                        <pre class="text-sm text-gray-300 font-sans leading-relaxed bg-gray-950 p-4 rounded-xl border border-gray-800">${escapeHtml(data.plan)}</pre>
                    </div>
                `;
            }

            // Render Code
            if (data.code_files && Object.keys(data.code_files).length > 0) {
                contentHtml += `<div class="mt-6 border-t border-gray-800 pt-6">
                    <h3 class="text-green-400 font-semibold mb-4 flex items-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Final Generated Code</h3>
                `;
                
                if (data.github_url) {
                    contentHtml += `
                        <a href="${data.github_url}" target="_blank" class="inline-flex items-center gap-2 text-sm bg-[#2ea043] hover:bg-[#2c974b] text-white px-4 py-2.5 rounded-lg mb-6 transition shadow-lg">
                            <i data-lucide="github" class="w-4 h-4"></i> View PR on GitHub
                        </a>
                    `;
                }

                for (const [filename, code] of Object.entries(data.code_files)) {
                    contentHtml += `
                        <div class="mb-6 rounded-xl overflow-hidden border border-gray-700 shadow-md">
                            <div class="bg-gray-800 px-4 py-2.5 border-b border-gray-700 flex items-center gap-2">
                                <i data-lucide="file-code" class="w-4 h-4 text-gray-400"></i>
                                <span class="text-xs text-gray-300 font-mono">${escapeHtml(filename)}</span>
                            </div>
                            <pre class="bg-gray-950 p-4 text-xs text-gray-300 overflow-x-auto font-mono leading-relaxed">${escapeHtml(code)}</pre>
                        </div>
                    `;
                }
                contentHtml += `</div>`;
            }

            const html = `
                <div class="self-start bg-gray-900 border border-gray-800 text-gray-100 rounded-2xl rounded-tl-sm p-6 w-full shadow-lg">
                    ${contentHtml}
                </div>
            `;
            chatHistory.insertAdjacentHTML('beforeend', html);
            lucide.createIcons();
            scrollToBottom();
        }

        function handleApprove() {
            appendUserMessage("✅ Approved. Proceed with the build phase.", []);
            callBackend("approve", null);
        }

        function handleSend() {
            if (isWaitingForResponse) return;
            const promptText = promptInput.value.trim();
            if (!promptText && selectedFiles.length === 0) return;
            
            const action = isPaused ? "feedback" : "start";
            
            // Visual Update
            appendUserMessage(promptText, selectedFiles);
            promptInput.value = '';
            promptInput.style.height = 'auto';
            
            callBackend(action, promptText);
        }

        async function callBackend(action, promptText = "") {
            const backendUrl = document.getElementById('backendUrl').value.replace(/\/$/, "");
            const githubToken = document.getElementById('githubToken').value;
            const githubRepo = document.getElementById('githubRepo').value;

            if (!backendUrl) return alert("Please provide your Cloudflared Backend URL in settings.");

            // UI Locks
            isWaitingForResponse = true;
            approvalBanner.classList.add('hidden');
            sendBtn.disabled = true;
            const loadingId = appendAgentLoading();

            const formData = new FormData();
            formData.append("thread_id", threadId);
            formData.append("action", action);
            if (promptText) formData.append("prompt", promptText);
            if (githubToken) formData.append("github_token", githubToken);
            if (githubRepo) formData.append("github_repo", githubRepo);
            
            // Only append files if it's the start action (or feedback action containing files)
            selectedFiles.forEach(f => formData.append("files", f));

            try {
                const response = await fetch(`${backendUrl}/api/chat`, { method: 'POST', body: formData });
                if (!response.ok) throw new Error("Backend connection failed.");
                
                const data = await response.json();
                
                // Remove Loading
                document.getElementById(loadingId).remove();
                
                // Render Agent Response
                appendAgentMessage(data);
                
                // Update State
                isPaused = data.is_paused;
                selectedFiles = [];
                fileList.innerHTML = '';

                if (isPaused) {
                    approvalBanner.classList.remove('hidden');
                    promptInput.placeholder = "Request changes to the plan...";
                } else {
                    promptInput.placeholder = "Describe the feature or project...";
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatHistory.insertAdjacentHTML('beforeend', `<div class="self-center bg-red-900/50 text-red-200 border border-red-700 px-4 py-2 rounded-lg text-sm">Connection Error: Ensure your FastAPI server and Cloudflare tunnel are running.</div>`);
            } finally {
                isWaitingForResponse = false;
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
