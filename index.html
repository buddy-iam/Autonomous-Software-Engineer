<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- The 'is-coding' class will be added dynamically when code is generated -->
<body>
    <div class="top-bar">
        <div class="brand">✨ AI Developer</div>
        <div class="config">
            <input type="text" id="backend-url" placeholder="Backend URL" />
            <button onclick="saveBackendUrl()">Connect</button>
        </div>
    </div>

    <div class="main-container">
        <!-- Left: Chat Interface -->
        <div class="chat-container">
            <div id="chat-history"></div>
            <div class="chat-input-box">
                <textarea 
                    id="chat-input" 
                    placeholder="Ask a question or describe an app to build... (Press Enter to send)" 
                    onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage('start'); }"
                ></textarea>
                <div class="chat-actions">
                    <button class="btn-approve" onclick="sendMessage('approve')">Approve Next File</button>
                    <button class="btn-send" onclick="sendMessage('start')">Send</button>
                </div>
            </div>
        </div>

        <!-- Right: Tabbed Auto-Saving Code Editor (Hidden until code is generated) -->
        <div class="code-container">
            <div class="tabs-header" id="file-tabs"></div>
            <div id="monaco-container"></div>
            <div class="status-bar">
                <span id="save-status">Waiting for code...</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
